<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* ---- Shared kit: tokens, base, tabs, drill stage, keys, report. Page-specific CSS follows in its own <style>. ---- */
  :root {
    --bg: #EDF1F7;
    --surface: #FFFFFF;
    --sunk: #E1E7F0;
    --ink: #14223A;
    --muted: #55657F;
    --line: #C3CEDF;
    --grid: rgba(29, 78, 216, 0.07);
    --accent: #1D4ED8;
    --on-accent: #FFFFFF;
    --mark: #FFE066;
    --on-mark: #14223A;
    --good: #157F52;
    --good-bg: #DDF3E8;
    --warn: #8A5A00;
    --warn-bg: #FBEFD2;
    --bad: #BE3A2B;
    --bad-bg: #FBE4E0;
    --font-display: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
    --font-body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-math: "STIX Two Math", "Cambria Math", "Latin Modern Math", "Noto Sans Math", math, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1626; --surface: #172238; --sunk: #111B2E; --ink: #E7EDF8; --muted: #9BAAC4;
      --line: #2E3E5C; --grid: rgba(142, 168, 255, 0.07); --accent: #8EA8FF; --on-accent: #0E1626;
      --mark: #F2CF4A; --on-mark: #14223A; --good: #5AD19A; --good-bg: #12382B;
      --warn: #F0B94A; --warn-bg: #3A2D10; --bad: #FF8C7A; --bad-bg: #44201C; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1626; --surface: #172238; --sunk: #111B2E; --ink: #E7EDF8; --muted: #9BAAC4;
    --line: #2E3E5C; --grid: rgba(142, 168, 255, 0.07); --accent: #8EA8FF; --on-accent: #0E1626;
    --mark: #F2CF4A; --on-mark: #14223A; --good: #5AD19A; --good-bg: #12382B;
    --warn: #F0B94A; --warn-bg: #3A2D10; --bad: #FF8C7A; --bad-bg: #44201C; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
  .wrap {
    max-width: 920px; margin: 0 auto; padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 22px;
  }
  math { font-family: var(--font-math); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .head { display: flex; flex-direction: column; gap: 6px; }
  .head h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 5vw, 2.3rem); line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .head p { margin: 0; color: var(--muted); max-width: 60ch; }

  .tabs { display: flex; gap: 2px 6px; flex-wrap: wrap; border-bottom: 1.5px solid var(--line); }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1.5px; padding: 10px 12px; font-family: var(--font-display); font-weight: 500; font-size: 1rem; color: var(--muted); }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  /* Two-column working area: .main (the drill) and .side (progress). Add .tw for two equal columns. */
  .work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
  @media (min-width: 820px) {
    .work { grid-template-columns: minmax(0, 1fr) 270px; align-items: start; }
    .work.tw { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; }
  }
  .main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  /* Graph-paper surface for the thing being asked. */
  .paper {
    background-color: var(--surface);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px; background-position: -1px -1px;
  }
  .stage {
    background-color: var(--surface);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px; background-position: -1px -1px;
    border: 1.5px solid var(--line); border-radius: 14px; min-height: 170px; padding: 22px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    transition: border-color .15s; min-width: 0;
  }
  .stage.ok { border-color: var(--good); }
  .stage.no { border-color: var(--bad); }
  .prompt { font-size: clamp(1.7rem, 7.5vw, 2.8rem); line-height: 1.15; text-align: center; max-width: 100%; }
  .prompt.small { font-size: clamp(1.2rem, 5vw, 1.7rem); }
  .tag { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface); padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }

  .feedback { min-height: 3.1em; font-size: .95rem; color: var(--muted); }
  .feedback b { color: var(--ink); font-weight: 600; }
  .feedback.good b { color: var(--good); }
  .feedback.bad b { color: var(--bad); }

  /* Answer keys. Set --cols on the container to change the column count. */
  .keypad { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 8px; }
  .key {
    min-height: 62px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
    font-size: 1.2rem; display: flex; align-items: center; justify-content: center; padding: 6px; text-align: center;
    transition: border-color .12s, background-color .12s, transform .06s; min-width: 0;
  }
  .key:hover:not(:disabled) { border-color: var(--accent); }
  .key:active:not(:disabled) { transform: scale(.97); }
  .key:disabled { opacity: .55; }
  .key.right { background: var(--good-bg); border-color: var(--good); opacity: 1; }
  .key.wrong { background: var(--bad-bg); border-color: var(--bad); opacity: 1; }
  .key.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .key.word { font-size: .92rem; font-weight: 500; }
  .undef { font-family: var(--font-body); font-size: .8rem; font-weight: 500; }

  .primary { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 13px 20px; font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
  .primary:disabled { background: var(--sunk); color: var(--muted); }
  .ghost { background: none; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 16px; font-weight: 500; font-size: .95rem; }
  .ghost:hover { border-color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }
  .link:hover { color: var(--ink); }

  /* Finish session bar (added by the kit under the tabs when this device cannot save on its own) */
  .sendbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: .92rem; color: var(--muted); }
  .sendbar span { flex: 1 1 200px; min-width: 0; }
  .sendlink { background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 11px 16px; font-family: var(--font-display); font-weight: 700; font-size: .95rem; text-decoration: none; white-space: nowrap; }

  /* Segmented control for switching modes inside a tab. Use aria-pressed. */
  .seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; align-self: flex-start; }
  .seg button { background: var(--surface); border: 0; padding: 8px 14px; font-size: .9rem; font-weight: 500; color: var(--muted); }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  .stats, .tiles { display: flex; flex-wrap: wrap; gap: 18px 30px; }
  .stat { display: flex; flex-direction: column; }
  .stat .n { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .n small { font-size: 1rem; font-weight: 500; color: var(--muted); }
  .stat .l { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }

  /* Mastery swatches: .lv is new, .lv1 .lv2 .lv3 fill toward automatic. */
  .lv { display: block; height: 22px; border-radius: 5px; border: 1.5px solid var(--line); background: var(--sunk); }
  .lv1 { background: color-mix(in srgb, var(--accent) 25%, var(--surface)); border-color: transparent; }
  .lv2 { background: color-mix(in srgb, var(--accent) 58%, var(--surface)); border-color: transparent; }
  .lv3 { background: var(--accent); border-color: transparent; }
  .lv.now { outline: 2.5px solid var(--ink); outline-offset: 1px; }
  .legend { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); }
  .legend .lv { width: 18px; height: 14px; border-radius: 4px; flex: none; }

  .note { font-size: .85rem; color: var(--muted); margin: 0; max-width: 65ch; }
  .check { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .clock { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  .steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }
  mn.hl, mi.hl, mrow.hl { background: var(--mark); color: var(--on-mark); padding: 0 .12em; border-radius: 2px; }

  .prose { display: flex; flex-direction: column; gap: 26px; }
  .prose section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .prose h2, .rep h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; margin: 0; text-wrap: balance; }
  .prose p { margin: 0; max-width: 65ch; }

  /* Report (built by the kit) */
  .rep { display: flex; flex-direction: column; gap: 26px; }
  .rep section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .rep p { margin: 0; max-width: 65ch; }
  .flags { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-width: 70ch; }
  .flags li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: baseline; }
  .pill { font-size: .68rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; text-align: center; padding: 2px 0; border-radius: 4px; }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.ok { background: var(--good-bg); color: var(--good); }
  .itable, .log { border-collapse: collapse; background: var(--surface); border: 1.5px solid var(--line); width: 100%; }
  .itable { max-width: 620px; }
  .itable th, .itable td, .log th, .log td { border-bottom: 1px solid var(--line); padding: 7px 10px; font-variant-numeric: tabular-nums; font-size: .9rem; text-align: right; }
  .itable tr:last-child td, .log tr:last-child td { border-bottom: 0; }
  .itable thead th, .log thead th { background: var(--sunk); font-size: .78rem; font-weight: 500; color: var(--muted); }
  .itable th:first-child, .itable td:first-child, .log th:first-child, .log td:first-child { text-align: left; }
  .itable tr.grp td { background: var(--sunk); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: left; }
  .itable td.st { font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; width: 76px; }
  .itable tr.miss td { background: var(--bad-bg); } .itable tr.miss td.st { color: var(--bad); }
  .itable tr.slow td { background: var(--warn-bg); } .itable tr.slow td.st { color: var(--warn); }
  .itable tr.ok td.st { color: var(--good); }
  .itable tr.none td { color: var(--muted); }
  .log { min-width: 520px; }
  .log th, .log td { white-space: nowrap; }
  .log th:last-child, .log td:last-child { text-align: left; padding-left: 18px; }
  .empty { color: var(--muted); }

  @media (max-width: 420px) {
    .key { font-size: 1.08rem; min-height: 56px; }
    .tab { padding: 9px 9px; font-size: .95rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
<style>
  /* Homepage: the practice pages plus the practice numbers, in one phone-width column. Top to bottom: today,
     the pages (each with its own numbers), this week as seven bars against the 20-minute line, what to work on,
     weak spots, then a link to the full log. */
  .wrap { max-width: 680px; }
  .topline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
  .topline .note { flex: 1 1 200px; }
  .banner { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: .92rem; font-weight: 500; }
  .today { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 1.05rem; }
  .weekhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
  .weeknav { display: flex; gap: 6px; }
  .weeknav button { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 12px; font-size: .9rem; min-height: 34px; }
  .weeknav button:disabled { opacity: .4; }
  .bars { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 10px 10px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .day .col { position: relative; width: 100%; height: 92px; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1.5px solid var(--line); }
  .day .col::before { content: ""; position: absolute; left: 0; right: 0; bottom: 66.6%; border-top: 1.5px dashed var(--line); }
  .day .bar { position: relative; width: 62%; max-width: 34px; border-radius: 5px 5px 0 0; background: var(--accent); min-height: 3px; }
  .day .bar.short { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); }
  .day .m { font-family: var(--font-display); font-weight: 700; font-size: .95rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .day .w { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .day.miss .m { color: var(--bad); }
  .day.off .m, .day.later .m { color: var(--muted); font-weight: 500; }
  .day.now .w { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .barkey { font-size: .78rem; color: var(--muted); margin: 0; }
  .spots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .spots li { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .spots b { font-family: var(--font-display); font-weight: 700; }
  .spots span { font-size: .93rem; }
  .spots i { font-style: normal; font-size: .7rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
  .pages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .pg { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; color: inherit; text-decoration: none; }
  .pg:hover, .pg:focus-visible { border-color: var(--accent); outline: none; }
  .pg.focus { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
  .pg-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
  .pg-h b { font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; color: var(--accent); }
  .pg-h .when { font-size: .85rem; color: var(--muted); }
  .pg-h .when.stale { color: var(--bad); font-weight: 600; }
  .pg .blurb { font-size: .93rem; color: var(--muted); }
  .pg .nums { font-size: .9rem; font-variant-numeric: tabular-nums; }
  .pg .tagline { font-size: .72rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
  .full { display: block; text-align: center; padding: 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--accent); font-weight: 600; text-decoration: none; }
  .full:hover, .full:focus-visible { border-color: var(--accent); outline: none; }
</style>

<div class="wrap">
  <header class="head">
    <h1>Math Practice</h1>
    <div class="topline"><p class="note" id="sub">Loading the practice numbers.</p><button class="ghost" id="refresh" type="button" hidden>Refresh</button></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main class="rep" id="out"></main>
</div>

<script>
(function () {
  'use strict';
  var SEND_URL = 'https://script.google.com/macros/s/AKfycbzO-i8YGpLXTBD5IMtu0_kDS4yO_BUv6fefHPqN3z5kjR9Fbqk2WA0n32gcmT6q0W96/exec';
  var SHEET_URL = 'https://docs.google.com/spreadsheets/d/1OYzfO7FvsNIWos3e-a8ufGJmVo6hZluOlGRcvO0wV98/edit';
  var LINKS = [{"href": "trig-values.html", "title": "Exact Trig Values", "blurb": "Flash cards and a timed table for sin, cos and tan at the six key angles."}, {"href": "unit-circle.html", "title": "Unit Circle Trainer", "blurb": "Find angles on the circle, read coordinates, and fill a blank circle from memory."}, {"href": "fractions.html", "title": "Fraction Reps", "blurb": "Short sets on fraction and algebra steps, with a mixed check."}, {"href": "graphs.html", "title": "Six Trig Graphs", "blurb": "Name each of the six trig graphs, plot key points, and learn the facts for each."}, {"href": "identities.html", "title": "Identity Builder", "blurb": "Recall the key identities and rebuild each one from the ones before it."}, {"href": "half-angle.html", "title": "Half-Angle Steps", "blurb": "Work half-angle problems one step at a time, then sprint."}, {"href": "friday-check.html", "title": "Friday Check", "blurb": "For a parent: quiz cards with answers, and the end-of-week checks."}];                            // [{ href, title, blurb }] from site.py
  var READY = /^https:\/\/script\.google\.com\/|^http:\/\/127\.0\.0\.1:/.test(SEND_URL);
  var DEMO = /[?&]demo\b/.test(location.search);
  var TARGET = 20;                                   // minutes a day in the plan
  var PAGES = ['Exact Trig Values', 'Unit Circle Trainer', 'Fraction Reps', 'Six Trig Graphs', 'Identity Builder', 'Half-Angle Steps'];
  var MINE = 'Friday Check';                         // the parent's quiz page: shown, never counted as practice
  var DRILL = 'Exact Trig Values';                   // the 5-minute daily drill
  var PLAN = [                                       // days: 0 = Monday
    { start: '2026-11-23', name: 'trig values and the unit circle', pages: ['Exact Trig Values', 'Unit Circle Trainer'], days: [0, 1, 2, 4] },
    { start: '2026-11-30', name: 'fractions and algebra', pages: ['Fraction Reps'], days: [0, 1, 2, 3, 4] },
    { start: '2026-12-07', name: 'graphs and the basic identities', pages: ['Six Trig Graphs', 'Identity Builder'], days: [0, 1, 2, 3, 4] },
    { start: '2026-12-14', name: 'sum and difference, then half-angle', pages: ['Identity Builder', 'Half-Angle Steps'], days: [0, 1, 2, 3, 4] }
  ];
  var WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function load(k, d) { try { var s = localStorage.getItem('home.' + k); return s == null ? d : JSON.parse(s); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem('home.' + k, JSON.stringify(v)); } catch (e) {} }

  /*PURE-START*/
  function dn(s) { var p = String(s).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
  function ds(n) { return new Date(n * 86400000).toISOString().slice(0, 10); }
  function wd(n) { return ((n + 3) % 7 + 7) % 7; }                      // 0 = Monday
  function monday(n) { return n - wd(n); }
  function num(x) { var v = parseFloat(x); return isFinite(v) && v > 0 ? v : 0; }
  function mins(m) { return m > 0 && m < 0.5 ? '<1' : String(Math.round(m)); }
  function pctOf(r, n) { return n ? Math.round(100 * r / n) + '%' : '–'; }
  function planWeek(n) {
    for (var i = 0; i < PLAN.length; i++) { var s = dn(PLAN[i].start); if (n >= s && n < s + 7) return i; }
    return -1;
  }
  /* build(rows): Sheet rows -> { days: { date: { min, n, r, pages: { name: {...} } } }, mine: same shape for the parent's page } */
  function build(rows) {
    var out = { days: {}, mine: {} };
    (rows || []).forEach(function (r) {
      if (!r || !/^\d{4}-\d{2}-\d{2}$/.test(r[1])) return;
      var name = String(r[0] || 'Unknown page'), side = name === MINE ? out.mine : out.days;
      var d = side[r[1]] || (side[r[1]] = { min: 0, n: 0, r: 0, pages: {} });
      var p = d.pages[name] || (d.pages[name] = { min: 0, n: 0, r: 0, level: '', tests: [], miss: [], slow: [], at: '' });
      var m = num(r[3]), n = num(r[4]), ok = Math.min(num(r[5]), n);
      d.min += m; d.n += n; d.r += ok; p.min += m; p.n += n; p.r += ok;
      var at = String(r[12] || '');
      if (at >= p.at) { p.at = at; if (r[8]) p.level = String(r[8]); }
      if (r[9]) p.tests.push(String(r[9]));
      if (r[10]) p.miss.push(String(r[10]));
      if (r[11]) p.slow.push(String(r[11]));
    });
    return out;
  }
  function practiced(d) { return !!d && (d.n > 0 || d.min > 0); }
  /* range(days, from, to): totals over day numbers from..to inclusive, plus per-page totals and the newest notes */
  function range(days, from, to) {
    var t = { min: 0, n: 0, r: 0, count: 0, pages: {} };
    for (var k = from; k <= to; k++) {
      var d = days[ds(k)];
      if (!practiced(d)) continue;
      t.min += d.min; t.n += d.n; t.r += d.r; t.count++;
      Object.keys(d.pages).forEach(function (name) {
        var p = d.pages[name], a = t.pages[name] || (t.pages[name] = { min: 0, n: 0, r: 0, level: '', test: '', miss: '', slow: '', last: 0 });
        a.min += p.min; a.n += p.n; a.r += p.r; a.last = k;
        if (p.level) a.level = p.level;
        if (p.tests.length) a.test = p.tests[p.tests.length - 1];
        if (p.miss.length) a.miss = p.miss.join(', ');
        if (p.slow.length) a.slow = p.slow.join(', ');
      });
    }
    return t;
  }
  function lastDay(days, upTo) {
    var best = -1;
    Object.keys(days).forEach(function (s) { var k = dn(s); if (k <= upTo && k > best && practiced(days[s])) best = k; });
    return best;
  }
  function lastFor(days, name, upTo) {
    var best = -1;
    Object.keys(days).forEach(function (s) { var k = dn(s), d = days[s]; if (k <= upTo && k > best && d.pages[name] && (d.pages[name].n > 0 || d.pages[name].min > 0)) best = k; });
    return best;
  }
  /* flags(days, T): the short "what to work on" list, worst first */
  function flags(days, T) {
    var F = [], last = lastDay(days, T), w = planWeek(T), started = T >= dn(PLAN[0].start), over = T > dn(PLAN[PLAN.length - 1].start) + 4;
    if (last < 0) { F.push({ lv: 'warn', text: 'No practice has arrived yet.' }); return F; }
    var age = T - last;
    if (age >= 3 && !over) F.push({ lv: 'bad', text: 'No practice for ' + age + ' days. The last session was ' + dayName(last) + '.' });
    if (w >= 0) {
      var s = dn(PLAN[w].start), missed = [], due = 0;
      PLAN[w].days.forEach(function (i) { if (s + i < T) { due++; if (!practiced(days[ds(s + i)])) missed.push(WD[i]); } });
      if (missed.length) F.push({ lv: missed.length > 1 ? 'bad' : 'warn', text: 'Missed ' + missed.length + ' planned ' + (missed.length === 1 ? 'day' : 'days') + ' this week: ' + missed.join(', ') + '.' });
      else if (due) F.push({ lv: 'ok', text: 'Every planned day so far this week has practice.' });
      if (due >= 2) PLAN[w].pages.forEach(function (name) {
        if (lastFor(days, name, T) < s) F.push({ lv: 'warn', text: name + ' has no practice this week. It is one of this week\'s pages.' });
      });
    }
    var seven = range(days, T - 6, T);
    if (seven.count >= 2 && seven.min / seven.count < 12) F.push({ lv: 'warn', text: 'Sessions are short: about ' + mins(seven.min / seven.count) + ' min on practice days. The plan calls for ' + TARGET + '.' });
    Object.keys(seven.pages).forEach(function (name) {
      var p = seven.pages[name];
      if (p.n >= 20 && Math.round(100 * p.r / p.n) < 70) F.push({ lv: 'warn', text: name + ': ' + pctOf(p.r, p.n) + ' right over the last 7 days.' });
    });
    if (started && !over && age < 3) {
      var drill = lastFor(days, DRILL, T), gap = drill < 0 ? T - dn(PLAN[0].start) + 1 : T - drill;
      if (gap >= 3) F.push({ lv: 'warn', text: 'The daily values drill has not been done for ' + gap + ' days. It opens every session.' });
    }
    if (!F.length) F.push({ lv: 'ok', text: 'Nothing stands out. Practice is steady.' });
    var rank = { bad: 0, warn: 1, ok: 2 };
    return F.sort(function (a, b) { return rank[a.lv] - rank[b.lv]; }).slice(0, 6);
  }
  function dayName(n) {
    var p = ds(n).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function ago(n, T) { return n < 0 ? 'Not yet' : (n === T ? 'Today' : (n === T - 1 ? 'Yesterday' : (T - n) + ' days ago')); }
  /*PURE-END*/

  /* ---------- Sample data: a made-up Wednesday in week 2 of the plan ---------- */
  function sample() {
    var E = 'Exact Trig Values', U = 'Unit Circle Trainer', F = 'Fraction Reps';
    function row(page, date, min, n, r, level, tests, miss, slow) { return [page, date, 'sample', min, n, r, '', '', level, tests || '', miss || '', slow || '', date + ' 17:00']; }
    return { ok: true, today: '2026-12-02', rows: [
      row(E, '2026-11-23', 9.4, 96, 71, '4 of 18', '', 'tan π/3 3/5, tan π/6 2/5, cos π/3 2/6', 'sin π/3 4.4s'),
      row(U, '2026-11-23', 11.8, 44, 33, '3 of 32'),
      row(E, '2026-11-24', 12.1, 131, 109, '9 of 18', '14/18 in 2:41', 'tan π/3 2/6, tan π/6 2/7', 'cos π/6 3.8s'),
      row(U, '2026-11-24', 6.2, 30, 24, '6 of 32'),
      row(E, '2026-11-25', 5.6, 70, 63, '12 of 18', '', '', 'tan π/6 3.4s'),
      row(U, '2026-11-25', 15.3, 82, 61, '11 of 32', '', 'Find 7π/6 2/4, Find 5π/4 2/5', ''),
      row(E, '2026-11-27', 6.0, 81, 77, '15 of 18', '18/18 in 1:52'),
      row(U, '2026-11-27', 13.9, 66, 55, '17 of 32', '13/16 in 6:10', 'Read 4π/3 2/3', 'Find 11π/6 5.1s'),
      row(MINE, '2026-11-27', 5.1, 10, 7, '', '', 'tan π/3 1/1, Coordinates at 7π/6 1/1', ''),
      row(E, '2026-11-30', 4.8, 64, 62, '16 of 18'),
      row(F, '2026-11-30', 14.6, 31, 19, '2 of 12', '', 'Unlike denominators 4/9, Root denominators 3/6', ''),
      row(F, '2026-12-02', 8.2, 22, 15, '3 of 12', '', 'Divide fractions 3/7, Unlike denominators 2/6', 'Multiply fractions 9.2s')
    ] };
  }

  /* ---------- Rendering ---------- */
  var data = null, T = 0, off = 0, state = { fresh: false, at: 0, error: '' };

  function tile(n, label) { return '<div class="stat"><span class="n">' + n + '</span><span class="l">' + label + '</span></div>'; }
  function todayNum() { var d = new Date(); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }

  /* The page links. Without numbers (not loaded yet, or offline with nothing cached) they still show and work. */
  function pagesBlock(B, seven, all, focus) {
    var h = '<section><h2>Practice pages</h2><ul class="pages">';
    LINKS.forEach(function (L) {
      var isMine = L.title === MINE, isFocus = focus.indexOf(L.title) >= 0, nums = '', when = '', stale = false;
      if (B) {
        if (isMine) {
          var m = range(B.mine, T - 69, T).pages[MINE];
          when = ago(m ? m.last : -1, T);
          if (m) nums = m.n + ' cards asked in the last 10 weeks, ' + pctOf(m.r, m.n) + ' known.';
        } else {
          var p7 = seven.pages[L.title], pa = all.pages[L.title], last = pa ? pa.last : -1;
          when = ago(last, T); stale = isFocus && T - last >= 3;
          if (pa) {
            var bits = [];
            bits.push(p7 ? 'Last 7 days: ' + mins(p7.min) + ' min, ' + pctOf(p7.r, p7.n) + ' right' : 'Nothing in the last 7 days');
            if (pa.level) bits.push('Level ' + pa.level);
            if (pa.test) bits.push('Latest test ' + pa.test);
            nums = bits.join('. ') + '.';
          }
        }
      }
      h += '<li><a class="pg' + (isFocus ? ' focus' : '') + '" href="' + esc(L.href) + '">' +
        (isFocus ? '<span class="tagline">This week\'s page</span>' : '') +
        '<span class="pg-h"><b>' + esc(L.title) + '</b>' + (when ? '<span class="when' + (stale ? ' stale' : '') + '">' + esc(when) + '</span>' : '') + '</span>' +
        '<span class="blurb">' + esc(L.blurb) + '</span>' + (nums ? '<span class="nums">' + esc(nums) + '</span>' : '') + '</a></li>';
    });
    return h + '</ul></section>';
  }

  function weekBlock(days) {
    var s = monday(T) + 7 * off, w = planWeek(s), planned = w >= 0 ? PLAN[w].days : [0, 1, 2, 3, 4];
    var tot = range(days, s, s + 6), h = '';
    var label = dayName(s).replace(/^\w+,?\s*/, '') + ' to ' + dayName(s + 6).replace(/^\w+,?\s*/, '');
    h += '<section><div class="weekhead"><h2>' + (off === 0 ? 'This week' : 'Week of ' + esc(dayName(s).replace(/^\w+,?\s*/, ''))) + '</h2>' +
      '<div class="weeknav"><button type="button" id="wk-prev" aria-label="Earlier week">&larr;</button><button type="button" id="wk-next" aria-label="Later week"' + (off >= 0 ? ' disabled' : '') + '>&rarr;</button></div></div>';
    h += '<p class="note">' + esc(label) + (w >= 0 ? '. Plan week ' + (w + 1) + ' of 4: ' + esc(PLAN[w].name) + '.' : (s < dn(PLAN[0].start) ? '. The plan starts Mon, Nov 23.' : '. After the four-week plan.')) + '</p>';
    h += '<div class="bars">';
    for (var i = 0; i < 7; i++) {
      var k = s + i, d = days[ds(k)], did = practiced(d), isPlan = planned.indexOf(i) >= 0;
      var cls = 'day' + (k === T ? ' now' : '') + (k > T ? ' later' : (did ? '' : (isPlan && k < T ? ' miss' : ' off')));
      var ht = did ? Math.max(4, Math.min(100, d.min / 30 * 100)) : 0;
      h += '<div class="' + cls + '"><div class="col">' + (did ? '<div class="bar' + (d.min < TARGET * 0.6 ? ' short' : '') + '" style="height:' + ht.toFixed(0) + '%"></div>' : '') + '</div>' +
        '<span class="m">' + (did ? mins(d.min) : (k > T ? '' : (isPlan && k < T ? 'none' : '–'))) + '</span><span class="w">' + WD[i] + '</span></div>';
    }
    h += '</div><p class="barkey">Minutes of practice each day. The dashed line is the plan\'s ' + TARGET + ' minutes.</p>';
    h += '<div class="tiles">' + tile(tot.count + '<small> of ' + planned.length + '</small>', 'Days practiced') +
      tile(mins(tot.min) + '<small> of ' + planned.length * TARGET + ' min</small>', 'Practice time') +
      tile(pctOf(tot.r, tot.n), 'Answers right') + '</div></section>';
    return h;
  }

  function render() {
    var h = '', words = { bad: 'Fix', warn: 'Watch', ok: 'Good' };
    if (!data) {                                       // no numbers yet: the links alone
      $('out').innerHTML = pagesBlock(null, null, null, []) + fullLink();
      paintSub(); return;
    }
    var B = build(data.rows), days = B.days;
    var td = days[ds(T)], w = planWeek(T), planToday = w >= 0 && PLAN[w].days.indexOf(wd(T)) >= 0;
    var seven = range(days, T - 6, T), all = range(days, T - 69, T), focus = w >= 0 ? PLAN[w].pages : [];

    h += '<section><h2>Today</h2><div class="today">';
    if (practiced(td)) {
      var names = Object.keys(td.pages);
      h += '<span class="pill ok">Done</span><span>' + mins(td.min) + ' min on ' + esc(names.join(' and ')) + ', ' + pctOf(td.r, td.n) + ' right.</span>';
    } else if (planToday) h += '<span class="pill warn">Not yet</span><span>No practice so far today. It is a planned day' + (focus.length ? ': ' + esc(focus.join(' and ')) : '') + '.</span>';
    else h += '<span class="pill">Off</span><span>No practice today. It is not a planned day.</span>';
    h += '</div></section>';

    h += pagesBlock(B, seven, all, focus);
    h += weekBlock(days);

    h += '<section><h2>What to work on</h2><ul class="flags">';
    flags(days, T).forEach(function (f) { h += '<li><span class="pill ' + f.lv + '">' + words[f.lv] + '</span><span>' + esc(f.text) + '</span></li>'; });
    h += '</ul></section>';

    var spots = '';
    PAGES.concat(Object.keys(seven.pages).filter(function (n) { return PAGES.indexOf(n) < 0; })).forEach(function (name) {
      var p = seven.pages[name];
      if (!p || (!p.miss && !p.slow)) return;
      spots += '<li><b>' + esc(name) + '</b>' + (p.miss ? '<span><i>Missed</i>' + esc(p.miss) + '</span>' : '') + (p.slow ? '<span><i>Slow</i>' + esc(p.slow) + '</span>' : '') + '</li>';
    });
    h += '<section><h2>Weak spots, last 7 days</h2>' + (spots
      ? '<p class="note">Wrong answers out of tries, and right answers that took too long. Bring this list to tutoring.</p><ul class="spots">' + spots + '</ul>'
      : '<p class="empty">No repeated misses or slow answers in the last 7 days.</p>') + '</section>';

    h += fullLink();
    $('out').innerHTML = h;
    $('wk-prev').addEventListener('click', function () { off--; render(); });
    $('wk-next').addEventListener('click', function () { if (off < 0) { off++; render(); } });
    $('wk-prev').disabled = off <= -9;
    paintSub();
  }
  function fullLink() {
    return /^https:\/\/docs\.google\.com\//.test(SHEET_URL)
      ? '<section><a class="full" href="' + esc(SHEET_URL) + '" target="_blank" rel="noopener">Open the full practice log</a>' +
        '<p class="note">A Google Sheet with every session, day by day and card by card. It opens for the people it is shared with. Practice shows up there and here about 15 seconds after it happens.</p></section>'
      : '';
  }
  function paintSub() {
    var t = '';
    if (DEMO) t = 'Sample data for a made-up Wednesday, Dec 2.';
    else if (!READY) t = 'Pick a page to practice.';
    else if (state.error) t = state.error;
    else if (state.at) t = (state.fresh ? 'Numbers updated ' : 'Numbers from ') + new Date(state.at).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' }) + '.';
    else t = 'Loading the practice numbers.';
    $('sub').textContent = t;
  }
  function show(d, fresh, at) {
    data = d; T = DEMO ? dn(d.today) : todayNum(); state.fresh = fresh; state.at = at; state.error = '';
    $('refresh').hidden = DEMO;
    render();
  }
  function fetchNow() {
    state.error = ''; if (!data) paintSub();
    fetch(SEND_URL + '?f=view', { mode: 'cors', credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error('not ok');
        var at = Date.now();
        save('cache', { at: at, data: j });
        show(j, true, at);
      })
      .catch(function () {
        state.error = data ? 'Could not refresh just now. These numbers are from ' + new Date(state.at).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' }) + '.' : 'Could not load the practice numbers. The pages still work. Tap Refresh to try again.';
        $('refresh').hidden = false; paintSub();
      });
  }

  $('refresh').addEventListener('click', fetchNow);
  document.addEventListener('visibilitychange', function () { if (!DEMO && READY && document.visibilityState === 'visible' && Date.now() - state.at > 60000) fetchNow(); });

  if (DEMO) {
    $('banner').hidden = false; $('banner').textContent = 'Sample data. This is how the page looks once practice is arriving.';
    show(sample(), true, Date.now());
  } else {
    T = todayNum();
    var c = load('cache', null);
    if (c && c.data && c.data.ok) show(c.data, false, c.at); else render();
    if (READY) fetchNow();
  }
})();
</script>
</body>
</html>
